name: Build Neelov OIDC backend

on:
  push:
    branches: [codex/authentik-oidc]
    paths:
      - Dockerfile.neelov
      - backend/app/**
      - backend/db/migrations/versions/20261006_nlv000000001_add_oidc_subject.py
      - .github/workflows/neelov-oidc-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.neelov
          push: true
          tags: ghcr.io/mambastick/familybudget-backend:neelov-oidc-${{ github.sha }}
          provenance: true
